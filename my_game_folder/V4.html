<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>穿越尋心記：文言十六夜</title>
    <style>
        /* ================= 1. 全局古典暗黑美學 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030303;
            color: #e2e2e2;
            font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-app {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 隱藏視窗 */
        .view-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .view-panel.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 5;
        }

        /* 常用按鈕特效 */
        .btn-ink {
            background: linear-gradient(135deg, #1c1a17 0%, #0c0a08 100%);
            border: 1px solid #8e7249;
            color: #d8be91;
            padding: 12px 30px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        .btn-ink:hover {
            border-color: #d8be91;
            box-shadow: 0 0 15px rgba(216, 190, 145, 0.4);
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* 重置按鈕樣式 */
        .btn-reset {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 10, 10, 0.6);
            border: 1px solid #8c3b3b;
            color: #e59393;
            padding: 8px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            background: #8c3b3b;
            color: #fff;
            box-shadow: 0 0 10px rgba(140, 59, 59, 0.5);
        }

        /* ================= 2. 簡約國風性別選擇界面 ================= */
        #gender-view {
            background: radial-gradient(circle, #0e0d0c 0%, #030303 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gender-title {
            font-size: 2.2rem;
            color: #d8be91;
            margin-bottom: 50px;
            letter-spacing: 6px;
            text-shadow: 0 0 10px rgba(216,190,145,0.3);
            text-align: center;
            line-height: 1.5;
        }

        .gender-box {
            display: flex;
            gap: 40px;
        }

        .gender-card {
            border: 1px dashed #4e3e2c;
            padding: 40px 60px;
            background: rgba(15,13,11,0.8);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-align: center;
            width: 260px;
        }

        .gender-card:hover {
            border-style: solid;
            border-color: #d8be91;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(142, 114, 73, 0.25);
        }

        .gender-card h3 {
            font-size: 2.6rem;
            color: #d8be91;
            margin-bottom: 15px;
            letter-spacing: 4px;
            font-family: 'Kaiti', 'DFKai-SB', serif;
        }

        .gender-card p {
            color: #8c8376;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* ================= 3. 3D 視差字碑主選單 ================= */
        #menu-view {
            background: linear-gradient(to bottom, #070707 0%, #020202 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            perspective: 1200px; /* 開啟3D空間透視 */
        }

        .menu-header {
            text-align: center;
            z-index: 10;
        }

        .menu-header h1 {
            font-size: 2rem;
            color: #d8be91;
            letter-spacing: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .menu-header p {
            color: #7c7264;
            font-size: 0.9rem;
            margin-top: 8px;
            letter-spacing: 2px;
        }

        /* 16字碑 3D 滾動視差容器 */
        .stele-parallax-container {
            width: 100%;
            max-width: 1200px;
            height: 52vh;
            display: flex;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 30px 10px;
            gap: 24px;
            z-index: 5;
            transition: transform 0.1s ease-out;
            scrollbar-width: thin;
            scrollbar-color: #4e3e2c transparent;
        }

        /* 美化滾動條 */
        .stele-parallax-container::-webkit-scrollbar {
            height: 6px;
        }
        .stele-parallax-container::-webkit-scrollbar-thumb {
            background-color: #4e3e2c;
            border-radius: 3px;
        }

        /* 單個字碑 */
        .stele-card {
            flex: 0 0 190px;
            height: 100%;
            background: linear-gradient(180deg, #181512 0%, #0a0908 100%);
            border: 1px solid #3c3224;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 15px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* 3D 視差微調：鼠標懸停 */
        .stele-card:hover {
            transform: translate3d(0, -10px, 20px) rotateY(5deg);
            border-color: #d8be91;
            box-shadow: 0 15px 30px rgba(216,190,145,0.15);
        }

        /* 碑面文字 */
        .stele-word-placeholder {
            font-size: 3rem;
            font-family: 'Kaiti', 'DFKai-SB', serif;
            color: #2a2520;
            transition: all 0.5s ease;
        }

        .stele-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #8c8273;
            letter-spacing: 2px;
        }

        .stele-quote {
            font-size: 0.75rem;
            color: #554e44;
            text-align: center;
            line-height: 1.4;
            height: 40px;
            overflow: hidden;
        }

        /* 碑林狀態樣式：未解鎖 */
        .stele-card.locked {
            filter: grayscale(1);
            opacity: 0.5;
            cursor: not-allowed;
        }
        .stele-card.locked::after {
            content: "🔒";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            opacity: 0.7;
        }

        /* 碑林狀態樣式：可挑戰 */
        .stele-card.available {
            border-color: #8e7249;
            box-shadow: 0 0 15px rgba(142, 114, 73, 0.2);
            animation: pulse-border 2s infinite alternate;
        }
        @keyframes pulse-border {
            0% { border-color: #3c3224; }
            100% { border-color: #d8be91; }
        }

        /* 碑林狀態樣式：已通關 */
        .stele-card.completed {
            border-color: #4b6a4f;
            box-shadow: inset 0 0 15px rgba(75, 106, 79, 0.3);
        }
        .stele-card.completed .stele-word-placeholder {
            color: #d8be91;
            text-shadow: 0 0 15px rgba(216, 190, 145, 0.6);
        }
        .stele-card.completed .stele-name {
            color: #d8be91;
        }

        /* ================= 4. 十六字神髓石碑 (底部) ================= */
        .divine-monument {
            width: 90%;
            max-width: 900px;
            background: rgba(12,11,10,0.85);
            border: 1px solid #4a3e2e;
            padding: 15px 20px;
            border-radius: 6px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            z-index: 10;
        }

        .monument-title {
            font-size: 0.8rem;
            color: #8c8273;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .monument-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 5px;
            text-align: center;
        }

        .monument-char {
            font-size: 1.25rem;
            font-family: 'Kaiti', 'DFKai-SB', serif;
            color: #22201d; /* 未點亮為暗灰色 */
            font-weight: bold;
            transition: all 0.8s ease;
        }

        .monument-char.active {
            color: #d8be91;
            text-shadow: 0 0 10px #d8be91, 0 0 20px rgba(216, 190, 145, 0.5);
        }

        /* ================= 5. 遊戲對話場景 (Stage) ================= */
        #stage-view {
            background-color: #000;
        }

        .stage-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 雙背景流暢淡入淡出 */
        .bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out;
            z-index: 1;
        }

        .bg-canvas.hidden {
            opacity: 0;
        }

        /* 暗角遮罩 */
        .bg-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* 角色立繪舞台 */
        .portrait-stage {
            position: absolute;
            bottom: 230px;
            left: 50%;
            transform: translateX(-50%);
            height: 58vh;
            z-index: 3;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none;
        }

        .portrait-img {
            height: 100%;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.9));
            transition: opacity 0.5s ease, transform 0.5s ease;
            animation: gentle-breath 4s ease-in-out infinite alternate;
        }

        .portrait-img.fade-out {
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes gentle-breath {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-6px) scale(1.01); }
        }

        /* ================= 6. 整合式黑金對話框 ================= */
        .dialogue-wrapper {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 900px;
            z-index: 10;
        }

        .name-box {
            position: absolute;
            top: -42px;
            left: 20px;
            background: linear-gradient(135deg, #1b1916 0%, #0c0b0a 100%);
            border: 1px solid #8e7249;
            color: #d8be91;
            padding: 6px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px 12px 0 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            letter-spacing: 2px;
        }

        .content-box {
            background: rgba(10, 9, 8, 0.92);
            border: 1px solid #483d2f;
            border-radius: 6px;
            padding: 25px 35px;
            min-height: 160px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dialogue-text {
            font-size: 1.1rem;
            line-height: 1.8;
            letter-spacing: 1.5px;
            color: #e5e5e5;
            min-height: 70px;
            white-space: pre-wrap;
        }

        /* 對話框按鈕 */
        .options-grid {
            margin-top: 15px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .dialogue-opt-btn {
            background: rgba(22, 20, 18, 0.7);
            border: 1px solid #4a3e2e;
            color: #c4ae8a;
            padding: 10px 20px;
            font-size: 0.95rem;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .dialogue-opt-btn:hover {
            background: linear-gradient(90deg, rgba(142, 114, 73, 0.25) 0%, rgba(10, 10, 10, 0.9) 100%);
            border-color: #d8be91;
            color: #ffffff;
            padding-left: 30px;
            box-shadow: 0 0 12px rgba(216, 190, 145, 0.25);
        }

        /* ================= 7. 全局加載/轉場特效遮罩 ================= */
        #mask-loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #030303;
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .ink-spinner {
            width: 60px;
            height: 60px;
            border: 2px dashed #d8be91;
            border-radius: 50%;
            animation: spin 2.5s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        #mask-loader p {
            margin-top: 25px;
            color: #d8be91;
            letter-spacing: 4px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div id="game-app">
    <!-- 全局一鍵重置存檔按鈕 (供開發者或玩家重玩測試) -->
    <button class="btn-reset" onclick="confirmResetSave()">重置進度</button>

    <!-- 雲端與轉場加載遮罩 -->
    <div id="mask-loader">
        <div class="ink-spinner"></div>
        <p id="loader-msg">正在架設跨時空通道...</p>
    </div>

    <!-- 1. 性別選擇面板 -->
    <div id="gender-view" class="view-panel active">
        <h2 class="gender-title">踏入時空隧道之先<br>請選擇你在這凡塵的性別</h2>
        <div class="gender-box">
            <div class="gender-card" onclick="selectGender('male')">
                <h3>男</h3>
                <p>意氣風發，志在千秋的公子</p>
            </div>
            <div class="gender-card" onclick="selectGender('female')">
                <h3>女</h3>
                <p>溫婉聰慧，靈動尋心的姑娘</p>
            </div>
        </div>
    </div>

    <!-- 2. 16夜主選單選單 -->
    <div id="menu-view" class="view-panel">
        <div class="menu-header">
            <h1 id="user-greeting">尋心之旅：十六夜</h1>
            <p>移動滑鼠以透視歷史，點擊金色字碑開啟冒險對話</p>
        </div>

        <!-- 3D 視差卡片容器 -->
        <div class="stele-parallax-container" id="parallax-container" onmousemove="handleParallax(event)" onmouseleave="resetParallax()">
            <!-- 卡片由 JS 動態生成 -->
        </div>

        <!-- 十六字神髓石碑 -->
        <div class="divine-monument">
            <div class="monument-title">當前尋回之文言神髓（點亮即化為玉碑）</div>
            <div class="monument-grid" id="monument-grid">
                <!-- 16個中文字由 JS 動態生成 -->
            </div>
        </div>
    </div>

    <!-- 3. 對話場景 -->
    <div id="stage-view" class="view-panel">
        <div class="stage-container">
            <!-- 雙驅動背景交叉過渡 -->
            <div id="canvas-bg-1" class="bg-canvas"></div>
            <div id="canvas-bg-2" class="bg-canvas hidden"></div>
            <div class="bg-vignette"></div>

            <!-- 立繪 -->
            <div class="portrait-stage">
                <img id="stage-portrait" class="portrait-img fade-out" src="" alt="立繪">
            </div>

            <!-- 整合式對話框 -->
            <div class="dialogue-wrapper">
                <div id="speaker-tag" class="name-box">旁白</div>
                <div class="content-box">
                    <div id="dialogue-text-area" class="dialogue-text">正在進入場景...</div>
                    <div id="options-area" class="options-grid"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ================= [配置區] =================
    // 這裡填入你的 Google Apps Script 部署 URL。
    // 如果為空或加載失敗，遊戲會自動無縫調用本地備份數據，不影響基本遊玩！

    // 16位古人與作品對應關係
    const characters = [
        { id: "li_bai", name: "李白", code: "狂", quote: "對影成三人，與子期無情遊", isUnlocked: true }, // 第一夜預設解鎖
        { id: "su_shi", name: "蘇軾", code: "達", quote: "人生如夢，一尊還酹江月", isUnlocked: true }, // 第二夜預設解鎖

    // 全局玩家存檔狀態
    let gameState = {
        gender: null, // 'male' or 'female'
        completedCharacters: [], // 已通關的 characterId
        unlockedWords: []        // 已解鎖的字
    };

    // ================= [本地備份劇本 (蘇軾)] =================
    const localBackupScript = {
        "START": {
            speaker: "蘇軾",
            text: "（大江東去，浪濤拍岸。那一尊老者臨江而立，白髮迎風，手中提着一壺未盡的濁酒，微笑着看著你。）\n這位{GENDER_TITLE}，可是來尋那赤壁古戰場的遊人？",

        },
        "HUMOR_1": {
            speaker: "蘇軾",
            text: "冷？『惟江上之清風，與山間之明月，耳得之而為聲，目遇之而成色。』天地造化，取之無禁，用之不竭。江月暖我心脾，何冷之有！你這提問倒是有趣。",
            bg: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?q=80&w=1200&auto=format&fit=crop",
            portrait: "https://api.dicebear.com/7.x/bottts/svg?seed=sushi_laugh",
            options: [
                { text: "先生心胸坦蕩。那麼敢問先生，我們如何能像您這般超然物外？", next: "WISDOM_1" }
            ],
            unlockWord: ""
        },
        "ENDING_1": {
            speaker: "蘇軾",
            text: "功名一紙，何足道哉。周公謙當年羽扇綸巾，談笑間檣櫓灰飛煙滅，如此偉業，如今安在？若你只盯着眼前的落差，便看不見眼前的浩瀚江河。\n去吧，心之『達』者，無處不逍遙。此【達】字贈予{GENDER_TITLE}！",
            bg: "https://images.unsplash.com/photo-1475274047050-1d0c0975c63e?q=80&w=1200&auto=format&fit=crop",
            portrait: "https://api.dicebear.com/7.x/bottts/svg?seed=sushi_trans",
            options: [
                { text: "（合十受教，將散發着微光的【達】字收於心底）", next: "END_FLOW" }
            ],
            unlockWord: "達"
        },
        "ENDING_2": {
            speaker: "蘇軾",
            text: "逝者如斯，而未嘗往也；盈虛者如彼，而卒莫消長也。江水雖奔流，但水本身未曾減少；月雖有陰晴，但月之本體並未消失。大自然生生不息，你我亦與之共存。何必哀羨滄海？\n去吧，心之『達』者，無處不逍遙。此【達】字贈予{GENDER_TITLE}！",
            bg: "https://images.unsplash.com/photo-1475274047050-1d0c0975c63e?q=80&w=1200&auto=format&fit=crop",
            portrait: "https://api.dicebear.com/7.x/bottts/svg?seed=sushi_trans",
            options: [
                { text: "（輕吐一口濁氣，將散發着溫熱的【達】字收於心底）", next: "END_FLOW" }
            ],
            unlockWord: "達"
        }
    };

    let activeScript = null;
    let currentBgTarget = 1;

    // ================= [1. 初始化與數據加載] =================
    window.onload = function() {
        loadSave(); // 讀取本地進度
        renderMonument(); // 渲染神髓石碑
        renderSteleMenu(); // 渲染16夜字碑
    };

    // 存檔存取機制 (localStorage)
    function loadSave() {
        const saved = localStorage.getItem("cang_xin_ji_save");
        if (saved) {
            gameState = JSON.parse(saved);
            switchView("menu-view");
            updateGreetingText();
        } else {
            switchView("gender-view");
        }
    }

    function saveGame() {
        localStorage.setItem("cang_xin_ji_save", JSON.stringify(gameState));
    }

    // 更新歡迎欄標題文本
    function updateGreetingText() {
        if (gameState.gender) {
            const prefix = gameState.gender === "male" ? "公子" : "姑娘";
            document.getElementById("user-greeting").innerText = `尋心之旅：十六夜（現世之身：${prefix}）`;
        }
    }

    // 彈出重置存檔確認
    function confirmResetSave() {
        const confirmClear = confirm("確定要抹去所有的尋心痕跡，重新開始旅程嗎？");
        if (confirmClear) {
            localStorage.removeItem("cang_xin_ji_save");
            gameState = {
                gender: null,
                completedCharacters: [],
                unlockedWords: []
            };
            showLoader("抹去記憶，時空重構中...", 1000).then(() => {
                switchView("gender-view");
                renderMonument();
                renderSteleMenu();
            });
        }
    }

    // ================= [2. 視窗切換與過渡] =================
    function switchView(viewId) {
        document.querySelectorAll(".view-panel").forEach(panel => {
            panel.classList.remove("active");
        });
        document.getElementById(viewId).classList.add("active");
    }

    function showLoader(text, duration = 800) {
        const loader = document.getElementById("mask-loader");
        document.getElementById("loader-msg").innerText = text;
        loader.style.display = "flex";
        loader.style.opacity = "1";

        return new Promise(resolve => {
            setTimeout(() => {
                loader.style.transition = "opacity 0.5s ease";
                loader.style.opacity = "0";
                setTimeout(() => {
                    loader.style.display = "none";
                    resolve();
                }, 500);
            }, duration);
        });
    }

    // ================= [3. 遊戲核心引擎] =================
    function selectGender(gender) {
        gameState.gender = gender;
        saveGame();
        showLoader("魂穿千古中...")
        .then(() => {
            updateGreetingText();
            switchView("menu-view");
        });
    }

    // 性別動態代稱替換引擎
    function formatDialogueText(text) {
        if (!text) return "";
        const title = gameState.gender === 'male' ? '公子' : '姑娘';
        const genderChar = gameState.gender === 'male' ? '男' : '女';
        return text.replace(/{GENDER_TITLE}/g, title)
                   .replace(/{GENDER}/g, genderChar)
                   .replace(/少男\/少女/g, title)
                   .replace(/公子\/姑娘/g, title);
    }

    // 渲染神髓碑
    function renderMonument() {
        const grid = document.getElementById("monument-grid");
        grid.innerHTML = "";
        characters.forEach(char => {
            const charDiv = document.createElement("div");
            charDiv.className = "monument-char";
            charDiv.innerText = char.code;
            // 如果玩家已經獲得了這個字，點亮它
            if (gameState.unlockedWords.includes(char.code)) {
                charDiv.className = "monument-char active";
            }
            grid.appendChild(charDiv);
        });
    }

    // 渲染 16位古人字碑主選單
    function renderSteleMenu() {
        const container = document.getElementById("parallax-container");
        container.innerHTML = "";

        characters.forEach(char => {
            const isCompleted = gameState.completedCharacters.includes(char.id);
            const isAvailable = char.isUnlocked || isCompleted; // 可挑戰狀態

            const stele = document.createElement("div");
            if (isCompleted) {
                stele.className = "stele-card completed";
            } else if (isAvailable) {
                stele.className = "stele-card available";
            } else {
                stele.className = "stele-card locked";
            }

            stele.innerHTML = `
                <div class="stele-word-placeholder">${char.code}</div>
                <div class="stele-name">${char.name}</div>
                <div class="stele-quote">「${char.quote}」</div>
            `;

            // 綁定點擊事件
            if (isAvailable) {
                stele.onclick = () => startCharacterStage(char.id, char.name);
            }

            container.appendChild(stele);
        });
    }

    // 啟動指定古人關卡
    async function startCharacterStage(charId, charName) {
        await showLoader(`正在為你召喚【${charName}】...`, 1200);
        switchView("stage-view");

        // 嘗試加載 GAS 雲端劇本
        activeScript = null;
        if (GAS_API_URL && GAS_API_URL.trim() !== "") {
            try {
                const response = await fetch(`${GAS_API_URL}?character=${charId}`);
                const data = await response.json();
                if (data && !data.error) {
                    activeScript = data;
                }
            } catch (e) {
                console.warn("未能連接到 GAS 雲端，自動啟用內置本地劇本備份。");
            }
        }

        // 若無雲端接口，直接使用本地備份
        if (!activeScript) {
            activeScript = localBackupScript; 
        }

        renderStageNode("START");
    }

    // 渲染對話節點
    function renderStageNode(nodeId) {
        if (nodeId === "END_FLOW") {
            exitStage();
            return;
        }

        const node = activeScript[nodeId];
        if (!node) {
            console.error("無效節點: " + nodeId);
            exitStage();
            return;
        }

        // 1. 設置說話者與對話文本 (經過性別代稱引擎替換)
        document.getElementById("speaker-tag").innerText = node.speaker;
        document.getElementById("dialogue-text-area").innerText = formatDialogueText(node.text);

        // 2. 雙背景流暢切換
        switchStageBg(node.bg);

        // 3. 立繪動態切換
        switchStagePortrait(node.portrait);

        // 4. 選項生成
        const optionsArea = document.getElementById("options-area");
        optionsArea.innerHTML = "";

        node.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "dialogue-opt-btn";
            btn.innerText = formatDialogueText(opt.text);
            btn.onclick = () => {
                // 如果該節點包含解鎖漢字指令
                if (node.unlockWord && node.unlockWord !== "") {
                    unlockCharacterWord(node.unlockWord);
                }

                // 立繪淡出，切換下一個節點
                const portrait = document.getElementById("stage-portrait");
                portrait.classList.add("fade-out");
                setTimeout(() => {
                    renderStageNode(opt.next);
                }, 300);
            };
            optionsArea.appendChild(btn);
        });
    }

    // 退出關卡
    async function exitStage() {
        await showLoader("重返字林...", 800);
        switchView("menu-view");
        renderMonument();
        renderSteleMenu();
    }

    // 解鎖古人贈字
    function unlockCharacterWord(word) {
        if (!gameState.unlockedWords.includes(word)) {
            gameState.unlockedWords.push(word);
        }
        const char = characters.find(c => c.code === word);
        if (char) {
            if (!gameState.completedCharacters.includes(char.id)) {
                gameState.completedCharacters.push(char.id);
            }
            // 解鎖下一個古人的可挑戰權
            const nextIndex = characters.findIndex(c => c.id === char.id) + 1;
            if (nextIndex < characters.length) {
                characters[nextIndex].isUnlocked = true;
            }
        }
        saveGame();
    }

    // ================= [4. 雙通道背景切換引擎] =================
    function switchStageBg(bgUrl) {
        if (!bgUrl || bgUrl.trim() === "") return;

        const bg1 = document.getElementById("canvas-bg-1");
        const bg2 = document.getElementById("canvas-bg-2");

        if (currentBgTarget === 1) {
            bg2.style.backgroundImage = `url('${bgUrl}')`;
            bg2.classList.remove("hidden");
            bg1.classList.add("hidden");
            currentBgTarget = 2;
        } else {
            bg1.style.backgroundImage = `url('${bgUrl}')`;
            bg1.classList.remove("hidden");
            bg2.classList.add("hidden");
            currentBgTarget = 1;
        }
    }

    function switchStagePortrait(portraitUrl) {
        const portrait = document.getElementById("stage-portrait");
        if (!portraitUrl || portraitUrl.trim() === "") {
            portrait.classList.add("fade-out");
            return;
        }

        const imgPreload = new Image();
        imgPreload.src = portraitUrl;
        imgPreload.onload = function() {
            portrait.src = portraitUrl;
            portrait.classList.remove("fade-out");
        };
    }

    // ================= [5. 3D 視差主菜單交互效果] =================
    function handleParallax(e) {
        const container = document.getElementById("parallax-container");
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const percentX = mouseX / rect.width; 

        const maxTiltY = 12; // 最大左右傾斜角度
        const currentTiltY = (percentX - 0.5) * maxTiltY * 2; 

        const cards = container.querySelectorAll(".stele-card");
        cards.forEach((card) => {
            const shiftAmount = (percentX - 0.5) * 15; // 左右平移像素
            card.style.transform = `translate3d(${shiftAmount}px, 0px, 0px) rotateY(${currentTiltY}deg)`;
        });
    }

    function resetParallax() {
        const container = document.getElementById("parallax-container");
        const cards = container.querySelectorAll(".stele-card");
        cards.forEach(card => {
            card.style.transform = "translate3d(0, 0, 0) rotateY(0deg)";
        });
    }
</script>
