<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古文十六夜</title>
    <style>
        /* ================= 1. 全局古典暗黑美學 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030303;
            color: #e2e2e2;
            font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-app {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 隱藏視窗 */
        .view-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .view-panel.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 5;
        }

        /* 常用按鈕特效 */
        .btn-ink {
            background: linear-gradient(135deg, #1c1a17 0%, #0c0a08 100%);
            border: 1px solid #8e7249;
            color: #d8be91;
            padding: 12px 30px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        .btn-ink:hover {
            border-color: #d8be91;
            box-shadow: 0 0 15px rgba(216, 190, 145, 0.4);
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* ================= 2. 全局控制欄 (左上全螢幕 & 右上重置) ================= */
        .global-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 1000;
            pointer-events: none; /* 允許穿透 */
        }

        .btn-control {
            pointer-events: auto; /* 啟用按鈕點擊 */
            background: rgba(20, 18, 16, 0.75);
            border: 1px solid #8e7249;
            color: #d8be91;
            padding: 8px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .btn-control:hover {
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(216, 190, 145, 0.4);
        }

        .btn-reset-ctrl {
            background: rgba(30, 10, 10, 0.65);
            border-color: #8c3b3b;
            color: #e59393;
        }

        .btn-reset-ctrl:hover {
            background: #8c3b3b;
            color: #fff;
            box-shadow: 0 0 10px rgba(140, 59, 59, 0.5);
        }

        /* ================= 3. 遊戲首頁 (標題Logo圖片浮空 & 背景浮光特效) ================= */
        #title-view {
            background: radial-gradient(circle, #141210 0%, #030303 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .title-container {
            animation: titleFadeIn 2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 標題圖片容器（配置背景金色浮光閃爍與收窄距離） */
        .title-logo-container {
            margin-bottom: 40px; /* 收窄與進入遊戲按鈕的垂直距離 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 40px;
            position: relative;
        }

        /* 金色浮光背景動畫 */
        .title-logo-container::before {
            content: "";
            position: absolute;
            width: 1520px;
            height: 300px;
            background: radial-gradient(circle, rgba(216, 190, 145, 0.25) 0%, rgba(216, 190, 145, 0.05) 50%, rgba(3, 3, 3, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(30px);
            animation: gold-glimmer 10s infinite alternate ease-in-out;
        }

        @keyframes gold-glimmer {
            0% {
                transform: scale(0.9);
                opacity: 0.6;
                background: radial-gradient(circle, rgba(216, 190, 145, 0.2) 0%, rgba(216, 190, 145, 0.03) 50%, rgba(3, 3, 3, 0) 70%);
            }
            50% {
                transform: scale(1.15);
                opacity: 0.95;
                background: radial-gradient(circle, rgba(255, 215, 0, 0.35) 0%, rgba(216, 190, 145, 0.08) 50%, rgba(3, 3, 3, 0) 70%);
            }
            100% {
                transform: scale(0.95);
                opacity: 0.7;
                background: radial-gradient(circle, rgba(218, 165, 32, 0.25) 0%, rgba(216, 190, 145, 0.04) 50%, rgba(3, 3, 3, 0) 70%);
            }
        }

        /* 標題圖片：完美浮動動畫，移除臨時虛線提示框，直接支持自定義標題圖片 */
        .main-title-logo {
            max-width: 1580px;
            max-height: 1190px;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: all 0.5s ease;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.95));
            animation: logo-float 4s infinite ease-in-out; /* 引入上下浮動 */
        }

        @keyframes logo-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .btn-enter-game {
            font-size: 1.3rem;
            padding: 15px 50px;
            animation: pulse-glow 2s infinite alternate;
        }

        @keyframes titleFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(216, 190, 145, 0.2); }
            100% { box-shadow: 0 0 25px rgba(216, 190, 145, 0.6); }
        }


        /* ================= 4. 簡約國風性別選擇界面 ================= */
        #gender-view {
            background: radial-gradient(circle, #0e0d0c 0%, #030303 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gender-title {
            font-size: 2.2rem;
            color: #d8be91;
            margin-bottom: 50px;
            letter-spacing: 6px;
            text-shadow: 0 0 10px rgba(216,190,145,0.3);
            text-align: center;
            line-height: 1.5;
        }

        .gender-box {
            display: flex;
            gap: 40px;
        }

        .gender-card {
            border: 1px dashed #4e3e2c;
            padding: 40px 60px;
            background: rgba(15,13,11,0.8);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-align: center;
            width: 260px;
        }

        .gender-card:hover {
            border-style: solid;
            border-color: #d8be91;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(142, 114, 73, 0.25);
        }

        .gender-card h3 {
            font-size: 2.6rem;
            color: #d8be91;
            margin-bottom: 15px;
            letter-spacing: 4px;
            font-family: 'Kaiti', 'DFKai-SB', serif;
        }

        .gender-card p {
            color: #8c8376;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* ================= 5. 3D 視差字碑主選單 ================= */
        #menu-view {
            background: linear-gradient(to bottom, #070707 0%, #020202 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px 25px 20px;
            perspective: 1200px; /* 開啟3D空間透視 */
        }

        .menu-header {
            text-align: center;
            z-index: 10;
            margin-top: 15px;
        }

        .menu-header h1 {
            font-size: 2.2rem;
            color: #d8be91;
            letter-spacing: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .menu-header p {
            color: #7c7264;
            font-size: 0.95rem;
            margin-top: 8px;
            letter-spacing: 2px;
        }

        /* 16字碑 3D 滾動視差容器 - 加高適配 */
        .stele-parallax-container {
            width: 100%;
            max-width: 1350px;
            height: 64vh; /* 再次提高容器高度，支持更高的卡片 */
            display: flex;
            align-items: flex-end; /* 底部對齊 */
            overflow-x: auto;
            overflow-y: visible;   /* 允許頂部書法字體向上超載溢出 */
            padding: 120px 30px 35px 30px; /* 增加頂部內邊距以容納更長卡片和溢出書法 */
            gap: 28px;
            z-index: 5;
            transition: transform 0.1s ease-out;
            scrollbar-width: thin;
            scrollbar-color: #4e3e2c transparent;
        }

        /* 美化滾動條 */
        .stele-parallax-container::-webkit-scrollbar {
            height: 6px;
        }
        .stele-parallax-container::-webkit-scrollbar-thumb {
            background-color: #4e3e2c;
            border-radius: 3px;
        }

        /* 單個字碑 - 高度大幅加高 (290px -> 360px) */
        .stele-card {
            flex: 0 0 230px; /* 寬度稍微拉寬 */
            height: 420px;   /* 再次拉長卡片，使全螢幕下視覺更具延伸感與震撼力 */
            background-color: #12100e;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid #3c3224;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 85px 20px 30px 20px; /* 拉長 padding，頂部預留更多空間給書法，底部更有呼吸感 */
            position: relative;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(0,0,0,0.95);
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* 3D 視差微調：鼠標懸停 */
        .stele-card:hover {
            transform: translate3d(0, -12px, 25px) rotateY(6deg);
            border-color: #d8be91;
            box-shadow: 0 18px 40px rgba(216,190,145,0.3);
        }

        /* 書法字體圖片（基礎樣式） */
        .stele-word-img {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -55%); /* 默認向上溢出約 55% */
            width: 100px; /* 配合大卡片微調寬度 */
            height: 100px;
            object-fit: contain;
            z-index: 10;
            filter: sepia(1) saturate(1.8) hue-rotate(10deg) brightness(1.05) drop-shadow(0 4px 8px rgba(0,0,0,0.95));
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.5s ease;
        }

        /* 懸停時書法字配合動畫微調 */
        .stele-card:hover .stele-word-img {
            transform: translate(-50%, -62%) scale(1.15) !important;
            filter: sepia(1) saturate(3) hue-rotate(15deg) brightness(1.4) drop-shadow(0 0 18px rgba(218, 165, 32, 1)) !important;
        }

        .stele-name {
            font-size: 1.35rem; /* 配合卡片比例微調字級 */
            font-weight: bold;
            color: #eae1d4;
            letter-spacing: 2px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
            z-index: 2;
        }

        .stele-quote {
            font-size: 0.85rem;
            color: #b5aba0;
            text-align: center;
            line-height: 1.5;
            height: 52px; /* 增加高度 */
            overflow: hidden;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
            z-index: 2;
        }

        /* 碑林狀態樣式：未解鎖 */
        .stele-card.locked {
            filter: grayscale(1) contrast(0.7);
            opacity: 0.35;
            cursor: not-allowed;
        }
        .stele-card.locked::after {
            content: "🔒";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -10%);
            font-size: 1.8rem;
            opacity: 0.7;
            z-index: 3;
        }

        /* 碑林狀態樣式：可挑戰 */
        .stele-card.available {
            border-color: #8e7249;
            box-shadow: 0 0 15px rgba(142, 114, 73, 0.25);
            animation: pulse-border 2s infinite alternate;
        }

        @keyframes pulse-border {
            0% { border-color: #3c3224; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
            100% { border-color: #d8be91; box-shadow: 0 0 20px rgba(216, 190, 145, 0.3); }
        }

        /* 碑林狀態樣式：已通關 */
        .stele-card.completed {
            border-color: #4b6a4f;
            box-shadow: inset 0 0 15px rgba(75, 106, 79, 0.35), 0 5px 15px rgba(0,0,0,0.8);
        }
        .stele-card.completed .stele-name {
            color: #d8be91;
            text-shadow: 0 0 8px rgba(216, 190, 145, 0.4);
        }

        /* ================= 6. 專屬書法字魂動動畫 CSS 引擎 ================= */

        /* [李白 - 狂] 劍氣月華：激烈的左右晃動與高速金光閃爍，彰顯狂傲 */
        .anim-libai-effect {
            animation: anim-libai 3.5s infinite ease-in-out;
        }
        @keyframes anim-libai {
            0%, 100% { 
                transform: translate(-50%, -55%) scale(1) rotate(-2deg); 
                filter: sepia(1) saturate(2.5) hue-rotate(15deg) brightness(1.15) drop-shadow(0 0 6px rgba(255,215,0,0.6));
            }
            50% { 
                transform: translate(-49%, -57%) scale(1.05) rotate(3deg); 
                filter: sepia(1) saturate(4.5) hue-rotate(25deg) brightness(1.4) drop-shadow(0 0 20px rgba(255,215,0,1));
            }
        }

        /* [蘇軾 - 達] 大江東去：如大江波濤般平滑、寬廣的上下起伏與柔和傾斜 */
        .anim-sushi-effect {
            animation: anim-sushi 5s infinite ease-in-out;
        }
        @keyframes anim-sushi {
            0%, 100% { 
                transform: translate(-50%, -53%) rotate(-3deg);
                filter: sepia(1) saturate(2.2) hue-rotate(12deg) brightness(1.2) drop-shadow(0 0 8px rgba(216,190,145,0.7));
            }
            50% { 
                transform: translate(-50%, -58%) rotate(3deg);
                filter: sepia(1) saturate(3) hue-rotate(18deg) brightness(1.3) drop-shadow(0 0 15px rgba(216,190,145,0.9));
            }
        }

        /* [柳宗元 - 悟] 心凝形釋：如禪定般極為緩慢的深呼吸，在明暗沉浮間綻放玉石般的光澤 */
        .anim-liuzongyuan-effect {
            animation: anim-liuzongyuan 6s infinite ease-in-out;
        }
        @keyframes anim-liuzongyuan {
            0%, 100% { 
                transform: translate(-50%, -55%) scale(0.97);
                filter: sepia(1) saturate(1.5) hue-rotate(8deg) brightness(0.95) drop-shadow(0 0 4px rgba(216,190,145,0.4));
            }
            50% { 
                transform: translate(-50%, -55%) scale(1.03);
                filter: sepia(1) saturate(3.5) hue-rotate(20deg) brightness(1.35) drop-shadow(0 0 25px rgba(216,190,145,1));
            }
        }

        /* [王維 - 空] 空山新雨：半官半隱、若隱若現。圖片透明度緩慢縹緲地虛化與凝實 */
        .anim-wangwei-effect {
            animation: anim-wangwei 7s infinite ease-in-out;
        }
        @keyframes anim-wangwei {
            0%, 100% { 
                opacity: 0.45;
                transform: translate(-50%, -54%) scale(0.96);
                filter: sepia(1) saturate(1.8) hue-rotate(10deg) brightness(1) drop-shadow(0 0 3px rgba(216,190,145,0.3));
            }
            50% { 
                opacity: 1;
                transform: translate(-50%, -57%) scale(1.02);
                filter: sepia(1) saturate(2.8) hue-rotate(15deg) brightness(1.25) drop-shadow(0 0 16px rgba(216,190,145,0.85));
            }
        }

        /* [莊子 - 無] 逍遙夢蝶：輕飄虛無。字體不規律地在空間中微微漂浮擺動，不拘一格 */
        .anim-zhuangzi-effect {
            animation: anim-zhuangzi 8s infinite ease-in-out;
        }
        @keyframes anim-zhuangzi {
            0%, 100% { transform: translate(-50%, -55%) translate(0, 0) rotate(0deg); }
            25% { transform: translate(-50%, -55%) translate(-4px, -6px) rotate(-2deg); }
            50% { transform: translate(-50%, -55%) translate(4px, -3px) rotate(3deg); }
            75% { transform: translate(-50%, -55%) translate(-2px, 5px) rotate(-1deg); }
        }

        /* 默認魂動特效（其餘未解鎖名家通關後之基礎特效） */
        .anim-default-effect {
            animation: anim-default 4.5s infinite ease-in-out;
        }
        @keyframes anim-default {
            0%, 100% { 
                transform: translate(-50%, -55%) scale(1); 
                filter: sepia(1) saturate(1.8) hue-rotate(10deg) brightness(1.1) drop-shadow(0 0 5px rgba(216,190,145,0.5));
            }
            50% { 
                transform: translate(-50%, -57%) scale(1.04); 
                filter: sepia(1) saturate(2.5) hue-rotate(15deg) brightness(1.3) drop-shadow(0 0 15px rgba(216,190,145,0.85));
            }
        }

        /* ================= 7. 十六字神髓石碑 (底部) ================= */
        .divine-monument {
            width: 90%;
            max-width: 950px;
            background: rgba(12,11,10,0.88);
            border: 1px solid #4a3e2e;
            padding: 15px 20px;
            border-radius: 6px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            z-index: 10;
            margin-bottom: 10px;
        }

        .monument-title {
            font-size: 0.85rem;
            color: #8c8273;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .monument-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 5px;
            text-align: center;
        }

        .monument-char {
            font-size: 1.35rem;
            font-family: 'Kaiti', 'DFKai-SB', serif;
            color: rgba(12,11,10,0.88); /* 未點亮為極暗灰色 */
            font-weight: bold;
            transition: all 0.8s ease;
        }

        .monument-char.active {
            color: #f7d18f;
            text-shadow: 0 0 12px #ffdf7a, 0 0 20px rgba(216, 190, 145, 0.6);
        }

        /* ================= 8. 遊戲對話場景 (Stage) ================= */
        #stage-view {
            background-color: #000;
        }

        .stage-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 雙背景流暢淡入淡出 */
        .bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out;
            z-index: 1;
        }

        .bg-canvas.hidden {
            opacity: 0;
        }

        /* 暗角遮罩 */
        .bg-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 25%, rgba(0,0,0,0.9) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* 角色立繪舞台 */
        .portrait-stage {
            position: absolute;
            bottom: 230px;
            left: 50%;
            transform: translateX(-50%);
            height: 58vh;
            z-index: 3;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none;
        }

        .portrait-img {
            height: 100%;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.9));
            transition: opacity 0.5s ease, transform 0.5s ease;
            animation: gentle-breath 4s ease-in-out infinite alternate;
        }

        .portrait-img.fade-out {
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes gentle-breath {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-6px) scale(1.01); }
        }

        /* ================= 9. 整合式黑金對話框 ================= */
        .dialogue-wrapper {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 900px;
            z-index: 10;
        }

        .name-box {
            position: absolute;
            top: -42px;
            left: 20px;
            background: linear-gradient(135deg, #1b1916 0%, #0c0b0a 100%);
            border: 1px solid #8e7249;
            color: #d8be91;
            padding: 6px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px 12px 0 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            letter-spacing: 2px;
        }

        .content-box {
            background: rgba(10, 9, 8, 0.94);
            border: 1px solid #483d2f;
            border-radius: 6px;
            padding: 25px 35px;
            min-height: 160px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dialogue-text {
            font-size: 1.1rem;
            line-height: 1.8;
            letter-spacing: 1.5px;
            color: #e5e5e5;
            min-height: 70px;
            white-space: pre-wrap;
        }

        /* 對話框按鈕 */
        .options-grid {
            margin-top: 15px;
            display: grid;

        const loader = document.getElementById("mask-loader");
        document.getElementById("loader-msg").innerText = text;
        loader.style.display = "flex";
        loader.style.opacity = "1";

        return new Promise(resolve => {
            setTimeout(() => {
                loader.style.transition = "opacity 0.5s ease";
                loader.style.opacity = "0";
                setTimeout(() => {
                    loader.style.display = "none";
                    resolve();
                }, 500);
            }, duration);
        });
    }

        return text.replace(/{GENDER_TITLE}/g, title)

                   .replace(/公子\/姑娘/g, title);

                stele.style.backgroundImage = `linear-gradient(180deg, rgba(10, 8, 6, 0.15) 0%, rgba(3, 2, 2, 0.99) 100%), url('${char.cardBg}')`;
            } else {
                stele.style.backgroundImage = `linear-gradient(180deg, rgba(10, 8, 6, 0.1) 0%, rgba(3, 2, 2, 1) 100%)`;
            }

            // 2. 書法字顯示與專屬動畫邏輯：只有在已通關時，才渲染專屬動畫與書法圖片
            let wordHTML = "";
            if (isCompleted) {
                const animClass = animClassMap[char.id] || "anim-default-effect";
                if (char.wordImg && char.wordImg.trim() !== "") {
                    wordHTML = `<img class="stele-word-img ${animClass}" src="${char.wordImg}" alt="${char.code}">`;
                } else {
                    wordHTML = `<div class="stele-word-placeholder ${animClass}">${char.code}</div>`;
                }
            } else {
                // 未通關/未解鎖時，隱藏書法字圖片，並保留一個隱形的定位佔位符以維護 3D Parallax 佈局一致
                wordHTML = `<div style="height: 100px; width: 100px; position: absolute; top: 0; left: 50%; transform: translate(-50%, -55%); z-index: 10;"></div>`;
            }

            stele.innerHTML = `
                ${wordHTML}
                <div class="stele-name">${char.name}</div>
                <div class="stele-quote">${isAvailable ? `「${char.quote}」` : '「文言神髓，尚未解鎖」'}</div>
            `;

            if (isAvailable) {
                stele.onclick = () => startCharacterStage(char.id, char.name);
            }

            container.appendChild(stele);
        });
    }

    async function startCharacterStage(charId, charName) {
        // 【核心優化】：立即強制重設對話框，防止上一位角色的對話殘留與舊按鈕顯示，提升過渡沉浸感
        document.getElementById("speaker-tag").innerText = "---";
        document.getElementById("dialogue-text-area").innerText = "正在開啟跨時空共鳴...";
        document.getElementById("options-area").innerHTML = "";
        
        const portrait = document.getElementById("stage-portrait");
        portrait.classList.add("fade-out"); // 立即隱藏上一次冒險的立繪

        await showLoader(`正在為你召喚【${charName}】...`, 1200);
        switchView("stage-view");

        activeScript = null;
        if (GAS_API_URL && GAS_API_URL.trim() !== "") {
            try {
                const response = await fetch(`${GAS_API_URL}?character=${charId}`);
                const data = await response.json();
                if (data && !data.error) {
                    activeScript = data;
                }
            } catch (e) {
                console.warn("未能連接到 GAS 雲端，自動啟用內置本地劇本備份。");
            }
        }

        if (!activeScript) {
            activeScript = localBackupScript; 
        }

        renderStageNode("START");
    }

    function renderStageNode(nodeId) {
        if (nodeId === "END_FLOW") {
            exitStage();
            return;
        }

        const node = activeScript[nodeId];
        if (!node) {
            console.error("無效節點: " + nodeId);
            exitStage();
            return;
        }

        document.getElementById("speaker-tag").innerText = node.speaker;
        document.getElementById("dialogue-text-area").innerText = formatDialogueText(node.text);

        switchStageBg(node.bg);
        switchStagePortrait(node.portrait);

        const optionsArea = document.getElementById("options-area");
        optionsArea.innerHTML = "";

        node.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "dialogue-opt-btn";
            btn.innerText = formatDialogueText(opt.text);
            btn.onclick = () => {
                if (node.unlockWord && node.unlockWord !== "") {
                    unlockCharacterWord(node.unlockWord);
                }

                const portrait = document.getElementById("stage-portrait");
                portrait.classList.add("fade-out");
                setTimeout(() => {
                    renderStageNode(opt.next);
                }, 300);
            };
            optionsArea.appendChild(btn);
        });
    }

    async function exitStage() {
        await showLoader("重返字林...", 800);
        switchView("menu-view");
        renderMonument();
        renderSteleMenu();
    }

    function unlockCharacterWord(word) {
        if (!gameState.unlockedWords.includes(word)) {
            gameState.unlockedWords.push(word);
        }
        const char = characters.find(c => c.code === word);
        if (char) {
            if (!gameState.completedCharacters.includes(char.id)) {
                gameState.completedCharacters.push(char.id);
            }
            const nextIndex = characters.findIndex(c => c.id === char.id) + 1;
            if (nextIndex < characters.length) {
                characters[nextIndex].isUnlocked = true;
            }
        }
        saveGame();
    }

    // ================= [5. 雙通道背景切換引擎] =================
    function switchStageBg(bgUrl) {
        if (!bgUrl || bgUrl.trim() === "") return;

        const bg1 = document.getElementById("canvas-bg-1");
        const bg2 = document.getElementById("canvas-bg-2");

        if (currentBgTarget === 1) {
            bg2.style.backgroundImage = `url('${bgUrl}')`;
            bg2.classList.remove("hidden");
            bg1.classList.add("hidden");
            currentBgTarget = 2;
        } else {
            bg1.style.backgroundImage = `url('${bgUrl}')`;
            bg1.classList.remove("hidden");
            bg2.classList.add("hidden");
            currentBgTarget = 1;
        }
    }

    function switchStagePortrait(portraitUrl) {
        const portrait = document.getElementById("stage-portrait");
        if (!portraitUrl || portraitUrl.trim() === "") {
            portrait.classList.add("fade-out");
            return;
        }

        const imgPreload = new Image();
        imgPreload.src = portraitUrl;
        imgPreload.onload = function() {
            portrait.src = portraitUrl;
            portrait.classList.remove("fade-out");
        };
    }

    // ================= [6. 3D 視差主菜單交互效果] =================
    function handleParallax(e) {
        const container = document.getElementById("parallax-container");
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const percentX = mouseX / rect.width; 

        const maxTiltY = 12; // 最大左右傾斜角度
        const currentTiltY = (percentX - 0.5) * maxTiltY * 2; 

        const cards = container.querySelectorAll(".stele-card");
        cards.forEach((card) => {
            const shiftAmount = (percentX - 0.5) * 15; // 左右平移像素
            card.style.transform = `translate3d(${shiftAmount}px, 0px, 0px) rotateY(${currentTiltY}deg)`;
        });
    }

    function resetParallax() {
        const container = document.getElementById("parallax-container");
        const cards = container.querySelectorAll(".stele-card");
        cards.forEach(card => {
            card.style.transform = "translate3d(0, 0, 0) rotateY(0deg)";
        });
    }
</script>
